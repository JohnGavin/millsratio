name: Build WebR Binaries

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggers for testing

permissions:
  contents: write  # Changed to write for deployment
  repository-projects: read   # Needed to access GitHub Packages

jobs:
  build-webr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build webR binaries
        uses: r-wasm/actions/build-rwasm@v2
        with:
          packages: "local::."
          repo-path: _site
          # Use webR v0.4.2 to match Shinylive 0.9.1's R 4.4.1
          webr-image: ghcr.io/r-wasm/webr:v0.4.2

      - name: Upload webR binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webr-repo
          path: _site/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: webr
          keep_files: true  # Don't delete other content on gh-pages
