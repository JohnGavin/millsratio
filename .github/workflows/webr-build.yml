name: Build WebR Package

on:
  push:
    branches: [main, webr-compilation-issue-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-webr-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      - name: Install rwasm
        run: |
          install.packages("pak")
          pak::pkg_install("r-wasm/rwasm")
        shell: Rscript {0}

      - name: Build WebR package
        run: |
          library(rwasm)
          # Build the package for WebAssembly
          build(".", webr = TRUE)
        shell: Rscript {0}

      - name: Create WebR repository
        run: |
          library(rwasm)
          # Create a CRAN-like repository structure
          deploy_repo(".", dest = "webr-repo")
        shell: Rscript {0}

      - name: Upload WebR package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webr-millsratio
          path: webr-repo/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./webr-repo
          destination_dir: webr-packages
          keep_files: true

  # Alternative: Use the r-wasm reusable workflow
  deploy-cran-repo:
    if: github.ref == 'refs/heads/main'
    uses: r-wasm/actions/.github/workflows/deploy-cran-repo.yml@v2
    with:
      packages: |
        .