name: Build and Release WebR Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-webr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install dependencies
        run: |
          install.packages('pak')
          pak::pkg_install(c('r-wasm/rwasm', 'r-wasm/webr'))
        shell: Rscript {0}

      - name: Build WebR package
        run: |
          library(rwasm)
          # Build for WebAssembly
          build(".", webr = TRUE)
        shell: Rscript {0}

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            _webr_build/**/*.tar.gz
            _webr_build/**/PACKAGES*