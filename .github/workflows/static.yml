# Deploy WebR packages as static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install WebR tools
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages('remotes')
          remotes::install_github('r-wasm/rwasm')
        shell: Rscript {0}

      - name: Build WebR package
        run: |
          library(rwasm)
          # Build the package for WebAssembly
          rwasm::build(".", dest_dir = "_webr_packages")
          # Create deployment directory
          dir.create("_site/webr-packages", recursive = TRUE)
          # Copy built packages
          if (dir.exists("_webr_packages")) {
            files <- list.files("_webr_packages", full.names = TRUE, recursive = TRUE)
            for (f in files) {
              file.copy(f, "_site/webr-packages/", recursive = FALSE)
            }
          }
          # Create PACKAGES index
          tools::write_PACKAGES("_site/webr-packages", type = "source")
        shell: Rscript {0}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4