# Nix-based R package check workflow
# Uses reproducible Nix environment defined in default-ci.nix
on:
  push:
    branches: [main, master]
  pull_request:

name: nix-check

permissions: read-all

jobs:
  nix-check:
    runs-on: ubuntu-latest
    
    name: Nix R-CMD-check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          
      - name: Configure Cachix
        uses: cachix/cachix-action@v13
        with:
          name: rstats-on-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          
      - name: Build Nix environment
        run: |
          nix-build default-ci.nix -A shell
          
      - name: Run R CMD check
        run: |
          nix-shell default-ci.nix --run "R -e 'devtools::check(error_on = \"warning\")'"
          
      - name: Show check results
        if: always()
        run: |
          if [ -f "*.Rcheck/00check.log" ]; then
            cat *.Rcheck/00check.log
          fi
